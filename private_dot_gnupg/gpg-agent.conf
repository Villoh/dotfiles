# Cache passphrases for practical session lifetime; reboot/restarting gpg-agent clears them.
default-cache-ttl 2147483647
max-cache-ttl 2147483647
default-cache-ttl-ssh 2147483647
max-cache-ttl-ssh 2147483647

# Enable SSH agent protocols. Unsupported platform-specific modes are ignored by GnuPG.
enable-ssh-support
enable-win32-openssh-support
enable-putty-support
