# AetherWM (Aether's Hyprland-compatible window manager) on Windows. Windows only: chezmoi never
# deploys it on Linux, where NixOS owns Hyprland (modules/home/desktop/hyprland in nixos-config).
#
# It mirrors the Linux key planes where AetherWM can: SUPER = windows, SUPER+SHIFT = move and apps,
# SUPER+CTRL(+ALT) = monitors and resize, SUPER+ALT = variants. Windows reserves a few Super
# combos (Win+L locks, Win+K casts), so turn on Settings > Hyprland > "Alt works like Super": every
# SUPER bind below then also works with ALT where the Alt combo is free.
#
# Keys already taken by the Aether shell (Settings > Windows > Keyboard shortcuts), so not bound here:
# Super (launcher), Super+A dashboard, Super+N sidebar, Super+U utilities, Super+Comma settings,
# Super+W wallpaper picker, Super+Escape session, Super+Shift+L lock, Super+Tab task view,
# Super+Shift+R reload the shell.
#
# Only dispatchers listed in AetherWM's README are used. Lines marked (verify) are Hyprland
# syntax that AetherWM may not implement; check them after the first run.

$mainMod = SUPER
$terminal = wt.exe

# ---- Look (same numbers as the Linux layout: gaps 4, border 2, rounding 12) ----
general {
    layout = dwindle
    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(8992a7ee)
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 12
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.55
}

input {
    follow_mouse = 1          # like Linux; 0 = click to focus, like Windows
}

# ---- Windows ----
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen, 0                # fullscreen (Linux: SUPER+F)
bind = $mainMod ALT, F, fullscreen, 1            # maximize (Linux: SUPER+ALT+F)
bind = $mainMod ALT, V, togglesplit
bind = $mainMod ALT, B, setlayout, bsp           # dwindle
bind = $mainMod ALT, L, setlayout, scrolling     # niri-style columns
bind = $mainMod, O, overview

# ---- Focus and move: arrows and vim keys ----
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = ALT, H, movefocus, l                      # Win+L is the Windows lock, so L also lives on Alt
bind = ALT, J, movefocus, d
bind = ALT, K, movefocus, u
bind = ALT, L, movefocus, r
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, L, swapwindow, r
bind = ALT SHIFT, L, swapwindow, r

# ---- Resize ----
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# ---- Monitors: SUPER+CTRL+ALT focuses, SUPER+SHIFT+CTRL moves the window (verify the mon: form) ----
bind = $mainMod CTRL ALT, H, focusmonitor, l
bind = $mainMod CTRL ALT, J, focusmonitor, d
bind = $mainMod CTRL ALT, K, focusmonitor, u
bind = $mainMod CTRL ALT, L, focusmonitor, r
bind = $mainMod SHIFT CTRL, H, movewindow, mon:l
bind = $mainMod SHIFT CTRL, J, movewindow, mon:d
bind = $mainMod SHIFT CTRL, K, movewindow, mon:u
bind = $mainMod SHIFT CTRL, L, movewindow, mon:r

# ---- Workspaces (ids 1-10 are the first monitor, 11-20 the second) ----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT ALT, 1, movetoworkspacesilent, 1   # move without following (Linux: SUPER+SHIFT+ALT+N)
bind = $mainMod SHIFT ALT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, 9, movetoworkspacesilent, 9
bind = $mainMod, Page_Down, workspace, e+1       # (verify) next / previous workspace
bind = $mainMod, Page_Up, workspace, e-1

# ---- Audio: mute toggles (nircmd, scoop) ----
# AetherWM has no mute action and its shell only takes the dedicated media keys.
bind = $mainMod SHIFT, S, exec, nircmd mutesysvolume 2                  # speakers
bind = $mainMod SHIFT, M, exec, nircmd mutesysvolume 2 default_record   # microphone

# ---- Scratchpad: a named special workspace, like Linux ----
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod ALT, S, movetoworkspace, special:scratchpad

# ---- Mouse: SUPER + left button moves, SUPER + right button resizes ----
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---- Window rules: tools that look wrong tiled ----
windowrule = float, class:^(Calculator|SnippingTool|Taskmgr)$
