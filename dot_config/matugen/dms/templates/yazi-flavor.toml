# Yazi flavor generated from the DMS Material palette. Do not edit the output:
# ~/.config/yazi/flavors/DMS.yazi/flavor.toml is rewritten on every
# wallpaper/theme change. Layout follows yazi-config/preset/theme-dark.toml.
# Palette roles mirror Strata's DMS theme (templates/strata.toml): Material
# roles for chrome, dank16 for semantic colours.

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }

find_keyword  = { fg = "{{colors.tertiary.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "{{colors.outline.default.hex}}", italic = true }

marker_copied   = { fg = "{{dank16.color2.default.hex}}", bg = "{{dank16.color2.default.hex}}" }
marker_cut      = { fg = "{{dank16.color1.default.hex}}", bg = "{{dank16.color1.default.hex}}" }
marker_marked   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{dank16.color3.default.hex}}", bg = "{{dank16.color3.default.hex}}" }

count_copied   = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color2.default.hex}}", bold = true }
count_cut      = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color1.default.hex}}", bold = true }
count_selected = { fg = "{{colors.background.default.hex}}", bg = "{{dank16.color3.default.hex}}", bold = true }

border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

unset_main = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[indicator]
parent  = { bg = "{{colors.surface_container_high.default.hex}}" }
current = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
preview = { bg = "{{colors.surface_container_high.default.hex}}" }

[status]
overall = { fg = "{{colors.on_surface_variant.default.hex}}" }

perm_sep   = { fg = "{{colors.outline_variant.default.hex}}" }
perm_type  = { fg = "{{dank16.color2.default.hex}}" }
perm_read  = { fg = "{{dank16.color3.default.hex}}" }
perm_write = { fg = "{{dank16.color1.default.hex}}" }
perm_exec  = { fg = "{{dank16.color6.default.hex}}" }

progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }

[which]
border          = { fg = "{{colors.primary.default.hex}}" }
cand            = { fg = "{{colors.secondary.default.hex}}", bold = true }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.on_surface.default.hex}}" }
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}", bold = true }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
btn_no  = { fg = "{{colors.on_surface_variant.default.hex}}" }

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}", bold = true }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}", bold = true }
title_warn  = { fg = "{{dank16.color3.default.hex}}", bold = true }
title_error = { fg = "{{colors.error.default.hex}}", bold = true }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}", bold = true }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[cmp]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}", bold = true }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }

[help]
border  = { fg = "{{colors.primary.default.hex}}" }
chord   = { fg = "{{colors.secondary.default.hex}}", bold = true }
action  = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }

# Git signs (git.yazi): same dank16 mapping Strata uses for diffs.
[git]
unknown   = { fg = "{{colors.outline.default.hex}}" }
ignored   = { fg = "{{colors.outline_variant.default.hex}}" }
untracked = { fg = "{{dank16.color6.default.hex}}" }
unstaged  = { fg = "{{dank16.color3.default.hex}}" }
staged    = { fg = "{{dank16.color2.default.hex}}" }
added     = { fg = "{{dank16.color2.default.hex}}" }
deleted   = { fg = "{{dank16.color1.default.hex}}", bold = true }
updated   = { fg = "{{dank16.color4.default.hex}}" }
clean     = { fg = "{{dank16.color2.default.hex}}" }

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "{{dank16.color3.default.hex}}" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "{{dank16.color5.default.hex}}" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{dank16.color1.default.hex}}" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{dank16.color6.default.hex}}" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline.default.hex}}" },
	# Special file
	{ url = "*", is = "orphan", bg = "{{colors.error.default.hex}}" },
	{ url = "*", is = "exec", fg = "{{dank16.color2.default.hex}}" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "{{colors.error.default.hex}}" },
	{ url = "*/", is = "dummy", bg = "{{colors.error.default.hex}}" },
	# Fallback
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },
]

# Icons. Folders follow the DMS palette; file icons keep Yazi v26.9.1's brand colours.
# The lists are written out in full for both modes and picked by DMS's mode, not by Yazi's
# own light/dark detection: Ghostty (GTK) always answers "light" to CSI ?996n, so Yazi would
# load its light preset's dark icons. In dark mode, colours with too little contrast are
# lightened (same hue, contrast >= 5.5 against #0b0d15).
# Generated once from the presets' theme-dark.toml and theme-light.toml. The script that
# did it is in git history: git show cdda57a:docs/linux/yazi-icons-gen.py
[icon]
dirs = [
	{ name = ".config", text = "", fg = "{{colors.primary.default.hex}}" },
	{ name = ".git", text = "", fg = "{{colors.primary.default.hex}}" },
