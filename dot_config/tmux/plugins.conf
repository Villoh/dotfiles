# Plugins for Linux distros other than NixOS, loaded by TPM.
# NixOS gets its own ~/.config/tmux/plugins.conf from Home Manager (nixos-config,
# modules/home/shell/tmux.nix), so .chezmoiignore skips this file there. Keep the options and
# keys below in sync with that module.
#
# One-time setup, then press prefix+I inside tmux to install the plugins. TPM keeps them next
# to this file because tmux.conf lives under ~/.config/tmux:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# fingers runs an install wizard the first time (it downloads its binary or builds it with
# crystal); its key is not bound until that finishes.
# Runtime tools the plugins call: fzf, python3, zoxide, and wl-clipboard or xclip.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum goes last: it appends its save hook to status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Prefix keys Omarchy and tmux already use: c C d D f h i k K l L m n N o p P q r R s t v w x z ? Space.
# fingers defaults to F, which tmux-fzf takes.
set -g @fingers-key y
# floax defaults to p (previous-window) and P (Omarchy: previous session).
set -g @floax-bind g
set -g @floax-bind-menu G
# which-key keeps its generated menu under XDG paths instead of the plugin directory.
set -g @tmux-which-key-xdg-enable 1
set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-capture-pane-contents on
set -g @continuum-restore on

# sesh is a binary (AUR: sesh-bin), not a TPM plugin.
if-shell "command -v sesh" 'bind -N "Pick a session (sesh)" T display-popup -E -w 80% -h 70% -d "#{pane_current_path}" -T "Sessions" "sesh picker -i"'

# workmux (git worktrees + agent status) is a binary, installed separately. Omarchy's window
# tabs plus its status icon; its config sets status_format: false so it leaves these alone.
set -g window-status-format "#[fg=brightblack] #I:#W#{?@workmux_status, #{@workmux_status},} "
set -g window-status-current-format "#[fg=blue,bold] #I:#W#{?@workmux_status, #{@workmux_status},} "
if-shell "command -v workmux" 'bind -N "Toggle workmux sidebar" B run-shell "workmux sidebar"'
if-shell "command -v workmux" 'bind -N "workmux dashboard" W display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T "workmux" "workmux dashboard"'
if-shell "command -v workmux" 'bind -N "workmux: last done or waiting agent" a run-shell "workmux last-done"'
if-shell "command -v workmux" 'bind -N "workmux: toggle last agent" A run-shell "workmux last-agent"'

# TPM must run last. Skipped until it is cloned.
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
