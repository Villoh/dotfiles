# Windows-only tools, merged with config.toml by mise (conf.d). Ignored on Linux.
# After editing, run `mise lock` so the locked setting accepts the new tools.
[tools]
# Package manager for the npm: backend (settings.npm.package_manager).
# Linux gets it from NixOS.
aube = "latest"
# Former `bin` inventory (GitHub release binaries).
"github:cakama3a/Polling" = "latest"
"github:vertopolkaLF/silence" = "latest"
"github:xdagiz/xytz" = "latest"
# Not in winget or scoop. Yapfast tracks stable releases (NixOS uses the nightly).
"github:crmne/zapfast" = "latest"
"github:anomalyco/hex" = "latest"
# Tags are desktop-vX.Y.Z (full) and desktop-minimal-vX.Y.Z; take only the full build.
"github:elianiva/meiro" = { version = "latest", version_prefix = "desktop-v" }
"github:yapfast/yapfast" = "latest"
# Former `cargo` inventory.
"cargo:pexels" = "latest"
