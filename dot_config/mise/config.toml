[settings]
minimum_release_age = "2d"
lockfile = true
paranoid = true
locked = true

# mise's embedded aube installs the npm: tools. It is the only installer that verifies their
# provenance, which `paranoid` requires: with aube_cli (the standalone executable) every npm:
# install fails. Reviewed low-download tools carry allow_low_downloads (embedded aube ignores
# aube_cli's aube_args).
[settings.npm]
package_manager = "aube"

[settings.pypi]
uvx = true

[settings.github]
credential_command = "gh auth token"

[settings.upgrade]

[tools]
# os = ["linux"]: Windows installs the same tool with scoop (packages/windows/scoop),
# so the two never put the same command on PATH.
claude = { version = "latest", os = ["linux"] }
codex = { version = "latest", os = ["linux"] }
oh-my-pi = { version = "latest", rename_exe = "omp", os = ["linux"] }
"npm:happy" = { version = "latest", allow_builds = ["happy"] }
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"], os = ["linux"] }
"npm:@earendil-works/pi-server" = "latest"
"npm:@gsd-build/sdk" = { version = "latest", allow_low_downloads = true }
"npm:@kaitranntt/ccs" = "latest"
"npm:@playwright/cli" = "latest"
"npm:agent-skill-manager" = { version = "latest", allow_low_downloads = true }
"npm:cf" = { version = "latest", allow_builds = ["workerd"] }
"npm:gitquarry" = { version = "latest", allow_low_downloads = true, allow_builds = ["gitquarry"] }
"npm:ocx" = { version = "latest", allow_low_downloads = true }
"npm:openwiki" = { version = "latest", allow_builds = ["better-sqlite3"] }
"npm:tokscale" = "latest"
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = [] }
"pypi:harlequin" = { version = "latest", extras = "mysql", uvx_args = "--python 3.13" }
# Preserve the excluded ast-grep-cli releases during installation and upgrades.
"pypi:headroom-ai" = { version = "latest", uvx_args = "--python 3.14 --with 'ast-grep-cli>=0.30.0,!=0.44.0,!=0.44.1'" }
"pypi:serena-agent" = { version = "latest", uvx_args = "--python 3.14" }
"pypi:trafilatura" = { version = "latest", uvx_args = "--python 3.14" }
"pypi:wallapop-mcp" = { version = "latest", uvx_args = "--python 3.14" }
bun = "latest"
ruff = { version = "latest", os = ["linux"] }
ty = { version = "latest", os = ["linux"] }
git-filter-repo = { version = "latest", os = ["linux"] }
"npm:socket" = "latest"
"github:router-for-me/CLIProxyAPI" = { version = "latest", os = ["linux"] }

# -- Windows only ---------------------------------------------------------------
# os = ["windows"] keeps them off Linux, while `mise lock` on Linux still locks them
# for Windows: one mise.lock serves both systems.
# Runs the pypi: tools (settings.pypi.uvx); without it they fail asking for pipx. Linux gets it from NixOS.
uv = { version = "latest", os = ["windows"] }
# Former `bin` inventory (GitHub release binaries).
"github:cakama3a/Polling" = { version = "latest", os = ["windows"] }
"github:vertopolkaLF/silence" = { version = "latest", os = ["windows"] }
"github:xdagiz/xytz" = { version = "latest", os = ["windows"] }
# Not in winget or scoop. Yapfast tracks stable releases (NixOS uses the nightly).
"github:crmne/zapfast" = { version = "latest", os = ["windows"] }
# A bare .exe whose name carries the version: bin fixes it for the Start Menu shortcut.
"github:anomalyco/hex" = { version = "latest", bin = "hex", os = ["windows"] }
# Tags are desktop-vX.Y.Z (full) and desktop-minimal-vX.Y.Z; take only the full build.
"github:elianiva/meiro" = { version = "latest", version_prefix = "desktop-v", os = ["windows"] }
"github:yapfast/yapfast" = { version = "latest", os = ["windows"] }
# Native Discord client. Only nightlies so far, published as prereleases.
"github:ViceVerse-cz/Serein" = { version = "latest", prerelease = true, asset_pattern = "serein-*-Windows-X64.zip", os = ["windows"] }
# ArtCraft "Crafting Apps" (early alpha, native Rust). Releases also ship .msi and symbols
# zips, so pin the x64 portable zip (app exe + <app>-cli.exe); Start Menu shortcuts in shortcuts.json.
"github:storytold/photocraft" = { version = "latest", asset_pattern = "photocraft-*-windows-x64-portable.zip", os = ["windows"] }
"github:storytold/pdfcraft" = { version = "latest", asset_pattern = "pdfcraft-*-windows-x64-portable.zip", os = ["windows"] }
"github:storytold/gridcraft" = { version = "latest", asset_pattern = "gridcraft-*-windows-x64-portable.zip", os = ["windows"] }
"github:storytold/deckcraft" = { version = "latest", asset_pattern = "deckcraft-*-windows-x64-portable.zip", os = ["windows"] }
"github:storytold/wordcraft" = { version = "latest", asset_pattern = "wordcraft-*-windows-x64-portable.zip", os = ["windows"] }
"github:storytold/filmcraft" = { version = "latest", asset_pattern = "filmcraft-*-windows-x64-portable.zip", os = ["windows"] }
"github:storytold/soundcraft" = { version = "latest", asset_pattern = "soundcraft-*-windows-x64-portable.zip", os = ["windows"] }
# Former `cargo` inventory: my fork of agynio/pexels-cli (crate and binary `pexels`),
# built from git with cargo from rustup (scoop).
"cargo:https://github.com/Villoh/pexels-cli" = { version = "branch:main", os = ["windows"] }

# -- Linux only -----------------------------------------------------------------
"github:PrimeIntellect-ai/prime-agent" = { version = "latest", asset_pattern = "prime-agent-*-linux-x64.tar.gz", filter_bins = "prime-agent", os = ["linux"] }
