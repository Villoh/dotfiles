[settings]
minimum_release_age = "2d"
lockfile = true
paranoid = true
locked = true

# The packaged CLI supports scoped exceptions for reviewed low-download tools.
[settings.npm]
package_manager = "aube_cli"

[settings.pypi]
uvx = true

[settings.github]
credential_command = "gh auth token"

[settings.upgrade]

[tools]
claude = "latest"
codex = "latest"
oh-my-pi = { version = "latest", rename_exe = "omp" }
"npm:happy" = { version = "latest", allow_builds = ["happy"] }
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:@earendil-works/pi-server" = "latest"
"npm:@gsd-build/sdk" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:@kaitranntt/ccs" = "latest"
"npm:@piewf/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:@playwright/cli" = "latest"
"npm:agent-skill-manager" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:cf" = { version = "latest", allow_builds = ["workerd"] }
"npm:gitquarry" = { version = "latest", aube_args = "--allow-low-downloads", allow_builds = ["gitquarry"] }
"npm:ocx" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:openwiki" = { version = "latest", allow_builds = ["better-sqlite3"] }
"npm:tokscale" = "latest"
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = [] }
"pypi:harlequin" = { version = "latest", extras = "mysql", uvx_args = "--python 3.13" }
# Preserve the excluded ast-grep-cli releases during installation and upgrades.
"pypi:headroom-ai" = { version = "latest", uvx_args = "--python 3.14 --with 'ast-grep-cli>=0.30.0,!=0.44.0,!=0.44.1'" }
"pypi:serena-agent" = { version = "latest", uvx_args = "--python 3.14" }
"pypi:trafilatura" = { version = "latest", uvx_args = "--python 3.14" }
"pypi:wallapop-mcp" = { version = "latest", uvx_args = "--python 3.14" }
bun = "latest"
ruff = "latest"
ty = "latest"
git-filter-repo = "latest"
"npm:socket" = "latest"
"github:router-for-me/CLIProxyAPI" = "latest"

# -- Windows only ---------------------------------------------------------------
# os = ["windows"] keeps them off Linux, while `mise lock` on Linux still locks them
# for Windows: one mise.lock serves both systems.
# Package manager for the npm: backend (settings.npm.package_manager).
# Linux gets it from NixOS.
aube = { version = "latest", os = ["windows"] }
# Former `bin` inventory (GitHub release binaries).
"github:cakama3a/Polling" = { version = "latest", os = ["windows"] }
"github:vertopolkaLF/silence" = { version = "latest", os = ["windows"] }
"github:xdagiz/xytz" = { version = "latest", os = ["windows"] }
# Not in winget or scoop. Yapfast tracks stable releases (NixOS uses the nightly).
"github:crmne/zapfast" = { version = "latest", os = ["windows"] }
"github:anomalyco/hex" = { version = "latest", os = ["windows"] }
# Tags are desktop-vX.Y.Z (full) and desktop-minimal-vX.Y.Z; take only the full build.
"github:elianiva/meiro" = { version = "latest", version_prefix = "desktop-v", os = ["windows"] }
"github:yapfast/yapfast" = { version = "latest", os = ["windows"] }
# Native Discord client. Only nightlies so far, published as prereleases.
"github:ViceVerse-cz/Serein" = { version = "latest", prerelease = true, asset_pattern = "serein-*-Windows-X64.zip", os = ["windows"] }

# -- Linux only -----------------------------------------------------------------
"github:PrimeIntellect-ai/prime-agent" = { version = "latest", asset_pattern = "prime-agent-*-linux-x64.tar.gz", filter_bins = "prime-agent", os = ["linux"] }
