[settings]
minimum_release_age = "2d"
lockfile = true
paranoid = true
locked = true

# The packaged CLI supports scoped exceptions for reviewed low-download tools.
[settings.npm]
package_manager = "aube_cli"

[settings.pipx]
uvx = true

[settings.github]
credential_command = "gh auth token"

[settings.upgrade]

[tools]
claude = "latest"
codex = "latest"
pi = "latest"
oh-my-pi = { version = "latest", rename_exe = "omp" }
"npm:happy" = { version = "latest", allow_builds = ["happy"] }
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:@earendil-works/pi-server" = "latest"
"npm:@gsd-build/sdk" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:@kaitranntt/ccs" = "latest"
"npm:@piewf/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:@playwright/cli" = "latest"
"npm:agent-skill-manager" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:cf" = { version = "latest", allow_builds = ["workerd"] }
"npm:gitquarry" = { version = "latest", aube_args = "--allow-low-downloads", allow_builds = ["gitquarry"] }
"npm:ocx" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:openwiki" = { version = "latest", allow_builds = ["better-sqlite3"] }
"npm:tokscale" = "latest"
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = [] }
"pipx:gamepadla-plus" = { version = "latest", uvx_args = "--python 3.11" }
"pipx:harlequin" = { version = "latest", extras = "mysql", uvx_args = "--python 3.13" }
# Preserve the excluded ast-grep-cli releases during installation and upgrades.
"pipx:headroom-ai" = { version = "latest", uvx_args = "--python 3.14 --with 'ast-grep-cli>=0.30.0,!=0.44.0,!=0.44.1'" }
"pipx:serena-agent" = { version = "latest", uvx_args = "--python 3.14" }
"pipx:trafilatura" = { version = "latest", uvx_args = "--python 3.14" }
bun = "latest"
ruff = "latest"
ty = "latest"
git-filter-repo = "latest"
"github:PrimeIntellect-ai/prime-agent" = { version = "latest", asset_pattern = "prime-agent-*-linux-x64.tar.gz", filter_bins = "prime-agent" }
"http:devin" = { version = "latest", url = "https://static.devin.ai/cli/{{ version }}/devin-{{ version }}-x86_64-unknown-linux.tar.gz", version_list_url = "https://static.devin.ai/cli/current/manifest.json", version_json_path = ".version" }
"npm:socket" = "latest"
"github:router-for-me/CLIProxyAPI" = "latest"
