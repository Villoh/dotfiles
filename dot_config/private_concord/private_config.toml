[display]
disable_image_preview = false
show_avatars = true
show_images = true
media_playback = true
image_preview_quality = "original"
attachment_viewer_quality = "original"
image_protocol = "auto"
animate_previews = "always"
show_custom_emoji = true
circular_avatars = false
hour_format_24 = true

[composer]
emojis_as_links = false
ping_on_reply = true

[reactions]

[credentials]
store = "auto"

[notifications]
desktop_notifications = true

[voice]
self_mute = false
self_deaf = false
input_source = "pulseaudio:alsa_input.pci-0000_0d_00.4.analog-stereo"
allow_microphone_transmit = true
push_to_talk = false
push_to_talk_shortcut = "F8"
noise_suppression = true
microphone_sensitivity = -30
microphone_volume = 100
voice_output_volume = 100

[presence]
share_rich_presence = true
