# Tests and builds the Windows installer GUI (installer/) on every change to
# it, and uploads dotfiles-installer.exe with SHA256SUMS as an artifact.
# installer-release.yml reuses it to build what it publishes.
name: installer-ci

on:
  push:
    branches: [main]
    paths: &paths
      - installer/**
      - install.ps1
      - install-gui.ps1
      - .chezmoi.toml.tmpl
      - packages/windows/**
      - .chezmoiscripts/run_once_00_windows-install.ps1.tmpl
      - .github/workflows/installer-*.yml
  pull_request:
    paths: *paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: Vet
        working-directory: installer
        run: go vet ./... && GOOS=windows go vet ./...
      # Reads the real .chezmoi.toml.tmpl and packages/windows, so a change
      # of their shape fails here.
      - name: Test
        working-directory: installer
        run: go test ./...
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in 'install.ps1', 'install-gui.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Error "${f}: $e"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Build
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath -ldflags "-s -w -H=windowsgui"
          -tags mygo_nodownload,mygo_noinspector
          -o ../dist/dotfiles-installer.exe .
      - name: Checksums
        working-directory: dist
        run: sha256sum dotfiles-installer.exe > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dotfiles-installer
          path: dist/
          if-no-files-found: error
