# Builds the Windows installer GUI (installer/) and publishes it, with
# SHA256SUMS, as a GitHub release that install-gui.ps1 downloads.
# Release: git tag installer-v0.1.0 && git push origin installer-v0.1.0
name: installer

on:
  push:
    tags: ["installer-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: Test
        working-directory: installer
        run: go test ./...
      - name: Build
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath -ldflags "-s -w -H=windowsgui"
          -tags mygo_nodownload,mygo_noinspector
          -o ../dist/dotfiles-installer.exe .
      - name: Checksums
        working-directory: dist
        run: sha256sum dotfiles-installer.exe > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Installer ${GITHUB_REF_NAME#installer-}"
          --notes "irm $RAW/install-gui.ps1 | iex"
